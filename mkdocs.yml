site_name: Balloon
site_description: 'Modernized and sophisticated tooltips for Compose Multiplatform, fully customizable with an arrow and animations.'
site_author: 'Jaewoong (skydoves)'
site_url: 'https://github.com/skydoves/Balloon'
edit_uri: 'tree/main/docs/'
remote_branch: gh-pages

docs_dir: docs

# Navigation
nav:
  - 'Overview': index.md
  - 'Getting Started': getting-started.md
  - 'Showing a Balloon': showing.md
  - 'Arrow': arrow.md
  - 'Size and Spacing': size-spacing.md
  - 'Customization': customization.md
  - 'Overlay': overlay.md
  - 'Animation': animation.md
  - 'Listeners': listeners.md
  - 'Migration from 1.x': migration.md
  - 'Balloon 1.x (View)':
    - 'Overview': legacy-view/index.md
    - 'Getting Started': legacy-view/getting-started.md
    - 'Showing Balloon': legacy-view/showing.md
    - 'Arrow': legacy-view/arrow.md
    - 'Text and Icon': legacy-view/text-icon.md
    - 'Customization': legacy-view/customization.md
    - 'Overlay': legacy-view/overlay.md
    - 'Animation': legacy-view/animation.md
    - 'Listeners': legacy-view/listeners.md
    - 'Persistence': legacy-view/persistence.md
    - 'Jetpack Compose':
      - 'Overview': legacy-view/compose/overview.md
      - 'BalloonState': legacy-view/compose/balloon-state.md
      - 'Compose Extensions': legacy-view/compose/extensions.md
  - 'Sponsor': sponsor.md

# Repository
repo_name: 'Balloon'
repo_url: 'https://github.com/skydoves/Balloon'

# Configuration
theme:
  name: 'material'
  language: 'en'
  icon:
    logo: material/tooltip-outline

  palette:
    primary: 'blue'
    accent: 'blue'
    scheme: slate

  font:
    text: 'Roboto'
    code: 'JetBrains Mono'

  features:
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

extra:
  analytics:
    provider: google
    property: G-1SBY14Q79E

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - footnotes
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
