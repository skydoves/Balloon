name: Publish Docs
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x
      # `-u`, not `--utc`: this job runs on macOS, whose BSD date rejects the long option and
      # leaves the cache key empty, so every run shares one bucket.
      - run: echo "cache_id=$(date -u '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
